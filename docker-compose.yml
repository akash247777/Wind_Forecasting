version: '3.8'

services:
  wind-trading-desk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura_wind_trading_desk
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your_gemini_api_key}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
